<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fd">
  <title>Chọn bàn — Góc Bếp IUH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shop/style.css">
</head>
<body>
  <header class="topbar order-topbar">
    <a class="brand" href="/" aria-label="Góc Bếp IUH"><img class="official-logo" src="/bank/iuh-logo.png" alt="Industrial University of Ho Chi Minh City"></a>
    <div class="order-brand-name"><strong>Góc Bếp IUH</strong></div>
  </header>
  <main>
    <section class="table-selection">
      <p class="eyebrow">CHÀO MỪNG BẠN ĐẾN VỚI GÓC BẾP IUH</p>
      <h1>Chọn bàn của bạn</h1>
      <p class="section-lead">Chọn bàn trước để bắt đầu gọi món. Chúng tôi sẽ mang món đến đúng chỗ bạn ngồi.</p>
      <div class="table-grid">
        <button class="table-choice" data-table="01" type="button"><span class="table-icon">⌑</span><strong>Bàn 01</strong><small>Chọn bàn này</small></button>
        <button class="table-choice" data-table="02" type="button"><span class="table-icon">⌑</span><strong>Bàn 02</strong><small>Chọn bàn này</small></button>
        <button class="table-choice" data-table="03" type="button"><span class="table-icon">⌑</span><strong>Bàn 03</strong><small>Chọn bàn này</small></button>
        <button class="table-choice" data-table="04" type="button"><span class="table-icon">⌑</span><strong>Bàn 04</strong><small>Chọn bàn này</small></button>
      </div>
      <div class="table-note"><span>✳</span> Chọn bàn xong, bạn có thể gọi thêm món bất cứ lúc nào.</div>
    </section>
  </main>
  <script>
    document.querySelectorAll('[data-table]').forEach(button => button.addEventListener('click', () => {
      localStorage.setItem('moc-table', button.dataset.table);
      location.href = '/shop/';
    }));
  </script>
</body>
</html>
