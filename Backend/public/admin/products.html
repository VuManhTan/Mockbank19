<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý sản phẩm — Mộc</title><link rel="stylesheet" href="/bank/style.css"><style>
body{background:#f4f6f3;color:#25342b}.admin{max-width:1180px;margin:35px auto;padding:0 22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{font:600 30px Georgia,serif;margin:0}.head a{color:#426148;font-size:11px}.panel{background:white;padding:20px;border:1px solid #e0e6df;margin-bottom:18px}.panel h2{font:600 19px Georgia,serif;margin:0 0 15px}.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.form label{font-size:10px;color:#68776b}.form input,.form select{width:100%;padding:10px;margin-top:5px;border:1px solid #dce3da;border-radius:6px;font-size:12px}.form .wide{grid-column:span 2}.actions{grid-column:1/-1;display:flex;gap:8px}.actions button,.row-actions button{border:0;border-radius:5px;padding:10px 15px;background:#526d5a;color:white;font-size:11px;cursor:pointer}.actions .cancel,.row-actions .delete{background:#ede9e3;color:#695d54}.notice{font-size:11px;color:#718072;min-height:17px}.wrap{background:white;border:1px solid #e0e6df;overflow:auto}.table{width:100%;min-width:760px;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0eb;font-size:11px}.table th{background:#f8f9f6;color:#718072;font-size:9px;letter-spacing:.08em}.thumb{width:42px;height:42px;object-fit:cover;background:#eee}.row-actions{display:flex;gap:6px}.row-actions button{padding:7px 9px}.empty{padding:20px;color:#718072;font-size:12px}@media(max-width:750px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.head{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><main class="admin"><header class="head"><div><p>QUẢN TRỊ CỬA HÀNG</p><h1>Sản phẩm</h1></div><div><a href="/admin/orders">Quản lý đơn hàng　·　</a><a href="/shop/">Xem cửa hàng　·　</a><a href="#" id="admin-logout">Đăng xuất</a></div></header>
<section class="panel"><h2 id="form-title">Thêm sản phẩm</h2><form id="product-form" class="form"><label>Tên sản phẩm<input name="name" required minlength="2" maxlength="120"></label><label>Giá (VND)<input name="price" type="number" min="1" step="1" required></label><label>Danh mục<select name="category"><option value="home">Nhà cửa</option><option value="living">Đời sống</option></select></label><label>Tên danh mục<input name="categoryName" value="Nhà cửa" maxlength="40"></label><label class="wide">URL ảnh<input name="imageUrl" type="url" placeholder="https://..."></label><label>Thẻ hiển thị<input name="tag" maxlength="40"></label><div class="actions"><button type="submit">Lưu sản phẩm</button><button class="cancel" id="cancel-edit" type="button" hidden>Hủy sửa</button></div></form><p class="notice" id="notice" role="status"></p></section>
<section class="wrap"><div id="products" class="empty">Đang tải sản phẩm…</div></section></main><script src="/api-client.js?v=20261017-3"></script><script>
const root=document.querySelector('#products'),form=document.querySelector('#product-form'),notice=document.querySelector('#notice');let editing=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>`${Number(n).toLocaleString('vi-VN')} ₫`;let products=[];
async function request(url,options={}){const response=await apiFetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(response.status===401){location.href='/admin/login?return=%2Fadmin%2Fproducts';throw Error('Đang chuyển đến đăng nhập quản trị.')}const data=await response.json();if(!response.ok)throw Error(data.message||'Yêu cầu thất bại');return data}
async function load(){try{products=(await request('/api/admin/products')).products;root.className='';root.innerHTML=products.length?`<table class="table"><thead><tr><th>ẢNH</th><th>TÊN</th><th>NHÓM</th><th>GIÁ</th><th>THAO TÁC</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.imageUrl?`<img class="thumb" src="${esc(p.imageUrl)}" alt="">`:'—'}</td><td><strong>${esc(p.name)}</strong><br><small>${esc(p.id)}</small></td><td>${esc(p.categoryName)}</td><td>${money(p.price)}</td><td><div class="row-actions"><button data-edit="${esc(p.id)}">Sửa</button><button class="delete" data-delete="${esc(p.id)}">Xóa</button></div></td></tr>`).join('')}</tbody></table>`:'<p class="empty">Chưa có sản phẩm.</p>'}catch(error){root.className='empty';root.textContent=error.message}}
function reset(){editing=null;form.reset();form.elements.categoryName.value='Nhà cửa';document.querySelector('#form-title').textContent='Thêm sản phẩm';document.querySelector('#cancel-edit').hidden=true}
form.addEventListener('submit',async event=>{event.preventDefault();const fields=Object.fromEntries(new FormData(form));fields.price=Number(fields.price);try{if(editing)await request(`/api/admin/products/${encodeURIComponent(editing)}`,{method:'PUT',body:JSON.stringify(fields)});else await request('/api/admin/products',{method:'POST',body:JSON.stringify(fields)});notice.textContent='Đã lưu sản phẩm.';reset();await load()}catch(error){notice.textContent=error.message}});
root.addEventListener('click',async event=>{const edit=event.target.closest('[data-edit]'),del=event.target.closest('[data-delete]');if(edit){editing=edit.dataset.edit;const p=products.find(item=>item.id===editing);for(const key of ['name','price','category','categoryName','imageUrl','tag'])form.elements[key].value=p[key]??'';document.querySelector('#form-title').textContent='Sửa sản phẩm';document.querySelector('#cancel-edit').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Xóa sản phẩm khỏi danh mục? Đơn hàng đã tạo vẫn giữ thông tin sản phẩm.')){try{await request(`/api/admin/products/${encodeURIComponent(del.dataset.delete)}`,{method:'DELETE'});notice.textContent='Đã xóa sản phẩm.';await load()}catch(error){notice.textContent=error.message}}});document.querySelector('#cancel-edit').addEventListener('click',reset);document.querySelector('#admin-logout').addEventListener('click',async event=>{event.preventDefault();await apiFetch('/api/admin/logout',{method:'POST'});clearAuthToken('admin');location.href='/admin/login'});load();
</script></body></html>
