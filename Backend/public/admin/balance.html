<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điều chỉnh số dư</title><link rel="stylesheet" href="/bank/style.css"><style>
body{background:#f4f6f3;color:#25342b}.admin{max-width:1000px;margin:35px auto;padding:0 22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{font:600 30px Georgia,serif;margin:0}.head a{color:#426148;font-size:12px}.panel,.wrap{background:white;border:1px solid #e0e6df;margin-bottom:18px;padding:20px}.panel h2{font:600 19px Georgia,serif;margin:0 0 15px}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.form label{font-size:12px;color:#68776b}.form input,.form select{width:100%;padding:10px;margin-top:5px;border:1px solid #dce3da;border-radius:6px}.form button{align-self:end;border:0;border-radius:5px;padding:11px 15px;background:#526d5a;color:white;cursor:pointer}.notice,.hint{font-size:12px;color:#718072;min-height:17px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0eb;font-size:12px}.table th{background:#f8f9f6;color:#718072;font-size:10px}.wrap{overflow:auto}.empty{color:#718072}@media(max-width:700px){.form{grid-template-columns:1fr}.head{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><main class="admin"><header class="head"><div><p>QUẢN TRỊ CỬA HÀNG</p><h1>Điều chỉnh số dư</h1></div><nav><a href="/admin/orders">Đơn hàng</a> · <a href="/admin/products">Sản phẩm</a> · <a href="/shop/">Cửa hàng</a> · <a href="#" id="admin-logout">Đăng xuất</a></nav></header>
<section class="panel"><h2>Cộng hoặc trừ số dư tài khoản</h2><form id="adjust-form" class="form"><label>Tài khoản<select name="accountId" id="account" required></select></label><label>Thao tác<select name="direction"><option value="add">Cộng số dư</option><option value="subtract">Trừ số dư</option></select></label><label>Số tiền (VND)<input name="amount" type="number" min="1" step="1" required></label><button type="submit">Xác nhận điều chỉnh</button></form><p class="hint">Mỗi điều chỉnh được lưu vào lịch sử giao dịch. Không thể trừ vượt quá số dư hiện có.</p><p class="notice" id="notice" role="status"></p></section>
<section class="wrap"><div id="accounts" class="empty">Đang tải tài khoản…</div></section></main><script src="/api-client.js?v=20261103-1"></script><script>
const host=document.querySelector('#accounts'),select=document.querySelector('#account'),form=document.querySelector('#adjust-form'),notice=document.querySelector('#notice');const money=n=>`${Number(n).toLocaleString('vi-VN')} ₫`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options={}){const r=await apiFetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(r.status===401){location.href='/admin/login?return=%2Fadmin%2Fbalance';throw Error('Vui lòng đăng nhập quyền admin.')}const d=await r.json();if(!r.ok)throw Error(d.message||'Yêu cầu thất bại');return d}
async function load(){try{const accounts=(await request('/api/admin/bank-accounts')).accounts;select.innerHTML=accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${esc(a.accountNumber)}</option>`).join('');host.className='';host.innerHTML=accounts.length?`<table class="table"><thead><tr><th>CHỦ TÀI KHOẢN</th><th>SỐ TÀI KHOẢN</th><th>TÊN ĐĂNG NHẬP</th><th>SỐ DƯ</th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.accountNumber)}</td><td>${esc(a.username)}</td><td><strong>${money(a.balance)}</strong></td></tr>`).join('')}</tbody></table>`:'Không có tài khoản.'}catch(e){host.textContent=e.message}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!confirm('Xác nhận điều chỉnh số dư tài khoản này?'))return;const fields=Object.fromEntries(new FormData(form));fields.amount=Number(fields.amount);try{await request(`/api/admin/bank-accounts/${encodeURIComponent(fields.accountId)}/balance`,{method:'POST',body:JSON.stringify({direction:fields.direction,amount:fields.amount})});notice.textContent='Đã điều chỉnh số dư và ghi lịch sử giao dịch.';form.elements.amount.value='';await load()}catch(error){notice.textContent=error.message}});document.querySelector('#admin-logout').addEventListener('click',async e=>{e.preventDefault();await apiFetch('/api/admin/logout',{method:'POST'});clearAuthToken('admin');location.href='/admin/login'});load();
</script></body></html>
