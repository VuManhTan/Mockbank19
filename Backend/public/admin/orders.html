<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đơn hàng — Mộc</title><link rel="stylesheet" href="/bank/style.css"><style>
body{background:#f4f6f3;color:#25342b}.admin{max-width:1180px;margin:35px auto;padding:0 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px}.admin-head h1{font:600 31px Georgia,serif;margin:0}.admin-head p{font-size:11px;color:#718072}.admin-head a{color:#426148;font-size:11px}.table-wrap{background:#fff;border:1px solid #e0e6df;overflow:auto}.orders{border-collapse:collapse;width:100%;min-width:760px}.orders th,.orders td{text-align:left;padding:14px 15px;border-bottom:1px solid #edf0eb;font-size:11px;vertical-align:top}.orders th{background:#f8f9f6;color:#718072;font-size:9px;letter-spacing:.1em}.orders td strong{font-size:11px}.items-list{color:#748075;line-height:1.7}.status{display:inline-block;padding:6px 8px;border-radius:30px;background:#f5ecd9;color:#896936;font-size:9px;font-weight:700}.status.paid{background:#e5f1e6;color:#3e7146}.message{padding:24px;color:#788279;font-size:12px}@media(max-width:600px){.admin{margin:24px auto}.admin-head{align-items:start;flex-direction:column}.admin-head h1{font-size:26px}}
</style></head><body><main class="admin"><div class="admin-head"><div><p>QUẢN TRỊ CỬA HÀNG</p><h1>Đơn hàng</h1><p>Danh sách cập nhật mỗi 5 giây</p></div><div><a href="/admin/products">Quản lý sản phẩm　·　</a><a href="#" id="admin-logout">Đăng xuất</a></div></div><div class="table-wrap"><div id="orders" class="message">Đang tải đơn hàng…</div></div></main><script src="/api-client.js"></script><script>
const host=document.querySelector('#orders');const money=n=>`${Number(n).toLocaleString('vi-VN')} ₫`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await apiFetch('/api/admin/orders');if(r.status===401){location.href='/admin/login?return=%2Fadmin%2Forders';return}const d=await r.json();if(!r.ok)throw Error(d.message||'Không tải được dữ liệu');const orders=d.orders||[];if(!orders.length){host.className='message';host.textContent='Chưa có đơn hàng.';return}host.className='';host.innerHTML=`<table class="orders"><thead><tr><th>MÃ ĐƠN</th><th>SẢN PHẨM</th><th>KHÁCH HÀNG</th><th>TỔNG TIỀN</th><th>THỜI GIAN</th><th>TRẠNG THÁI</th></tr></thead><tbody>${orders.map(o=>`<tr><td><strong>${esc(o.orderId)}</strong></td><td class="items-list">${(o.items||[]).map(i=>`${esc(i.name)} × ${Number(i.quantity)}`).join('<br>')}</td><td>${esc(o.customerName||'')}</td><td><strong>${money(o.amount)}</strong></td><td>${new Date(o.createdAt).toLocaleString('vi-VN')}</td><td><span class="status ${o.status==='PAID'?'paid':''}">${o.status==='PAID'?'ĐÃ THANH TOÁN':'CHỜ THANH TOÁN'}</span></td></tr>`).join('')}</tbody></table>`}catch(e){host.className='message';host.textContent=e.message}}document.querySelector('#admin-logout').addEventListener('click',async e=>{e.preventDefault();await apiFetch('/api/admin/logout',{method:'POST'});clearAuthToken('admin');location.href='/admin/login'});load();setInterval(load,5000);
</script></body></html>
