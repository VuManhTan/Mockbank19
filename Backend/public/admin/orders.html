<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý đơn hàng — IUH</title><link rel="stylesheet" href="/bank/style.css"><style>
body{background:#f4f6f3;color:#25342b}.admin{max-width:1320px;margin:35px auto;padding:0 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:23px}.admin-head h1{font:600 31px Georgia,serif;margin:0}.admin-head p{font-size:11px;color:#718072}.admin-head a{color:#244a9a;font-size:11px}.table-wrap{background:#fff;border:1px solid #dce5f2;overflow:auto}.staff-hint{padding:12px 15px;background:#fff8df;color:#675b39;border-bottom:1px solid #f0e1ad;font-size:11px}.orders{border-collapse:collapse;width:100%;min-width:960px}.orders th,.orders td{text-align:left;padding:13px;border-bottom:1px solid #edf0eb;font-size:11px;vertical-align:top}.orders th{background:#f8f9f6;color:#718072;font-size:9px;letter-spacing:.1em}.items-list{color:#748075;line-height:1.7}.status{display:inline-block;padding:6px 8px;border-radius:30px;background:#fff2c9;color:#795800;font-size:9px;font-weight:700}.status.paid{background:#e8effb;color:#244a9a}.payment-kind{color:#64748b;font-size:9px}.cash-confirm-button{border:0;border-radius:5px;background:#244a9a;color:white;padding:9px 11px;font-size:10px;font-weight:700;cursor:pointer}.cash-confirm-button:disabled{opacity:.5}.message{padding:24px;color:#788279;font-size:12px}@media(max-width:600px){.admin{margin:24px auto}.admin-head{align-items:start;flex-direction:column}.admin-head h1{font-size:26px}}
</style></head><body><main class="admin"><div class="admin-head"><div><a class="admin-logo-link" href="/shop/"><img class="admin-logo" src="/bank/iuh-logo.png" alt="Industrial University of Ho Chi Minh City"></a><p>QUẢN TRỊ CỬA HÀNG</p><h1>Đơn hàng</h1><p>Danh sách tự cập nhật mỗi 5 giây</p></div><div><a href="/admin/products">Quản lý sản phẩm　·　</a><a href="/admin/payment-settings">Tài khoản nhận tiền　·　</a><a href="/admin/login" id="admin-logout">Đăng xuất</a></div></div><section class="table-wrap"><div class="staff-hint">Chỉ xác nhận tiền mặt sau khi nhân viên đã nhận đủ tiền. Thao tác này yêu cầu đăng nhập quản trị.</div><div id="orders" class="message">Đang tải đơn hàng…</div></section></main>
<script src="/api-client.js?v=20261126-1"></script><script>
const host=document.querySelector('#orders');const money=n=>`${Number(n).toLocaleString('vi-VN')} ₫`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let busy=false;
async function load(){if(busy)return;try{const r=await apiFetch('/api/admin/orders');if(r.status===401){location.href='/admin/login?return=%2Fadmin%2Forders';return}const d=await r.json();if(!r.ok)throw Error(d.message||'Không tải được dữ liệu');const orders=d.orders||[];if(!orders.length){host.className='message';host.textContent='Chưa có đơn hàng.';return}host.className='';host.innerHTML=`<table class="orders"><thead><tr><th>MÃ ĐƠN</th><th>BÀN</th><th>MÓN VÀ GHI CHÚ</th><th>KHÁCH</th><th>TỔNG TIỀN</th><th>THỜI GIAN</th><th>THANH TOÁN</th><th>THAO TÁC</th></tr></thead><tbody>${orders.map(o=>{const paid=o.paymentStatus==='PAID'||o.status==='PAID',cash=o.paymentMethod==='CASH';return `<tr><td><strong>${esc(o.orderId)}</strong></td><td>${o.tableId?`Bàn ${esc(o.tableId)}`:'—'}</td><td class="items-list">${(o.items||[]).map(i=>`${esc(i.name)} × ${Number(i.quantity)}${i.note?`<br><small>Ghi chú: ${esc(i.note)}</small>`:''}`).join('<br>')}</td><td>${esc(o.customerName||'Khách tại bàn')}</td><td><strong>${money(o.amount)}</strong></td><td>${new Date(o.createdAt).toLocaleString('vi-VN')}</td><td><span class="payment-kind">${cash?'TIỀN MẶT':o.paymentMethod==='QR'?'QR / CHUYỂN KHOẢN':'—'}</span><br><span class="status ${paid?'paid':''}">${paid?(cash?'ĐÃ NHẬN TIỀN MẶT':'ĐÃ THANH TOÁN'):'CHỜ THANH TOÁN'}</span>${o.cashConfirmedBy?`<br><small>NV: ${esc(o.cashConfirmedBy)}</small>`:''}</td><td>${cash&&!paid?`<button class="cash-confirm-button" data-confirm-cash="${esc(o.orderId)}" data-amount="${Number(o.amount)}">Xác nhận đã nhận tiền</button>`:'—'}</td></tr>`}).join('')}</tbody></table>`}catch(e){host.className='message';host.textContent=e.message}}
host.addEventListener('click',async event=>{const button=event.target.closest('[data-confirm-cash]');if(!button)return;const orderId=button.dataset.confirmCash;if(!confirm(`Xác nhận đã nhận đủ ${money(button.dataset.amount)} cho đơn ${orderId}?`))return;busy=true;button.disabled=true;try{const response=await apiFetch(`/api/admin/orders/${encodeURIComponent(orderId)}/cash-payment`,{method:'POST'});const data=await response.json();if(!response.ok)throw Error(data.message||'Không xác nhận được tiền mặt');busy=false;await load()}catch(error){alert(error.message);button.disabled=false}finally{busy=false}});
document.querySelector('#admin-logout').addEventListener('click',async event=>{event.preventDefault();await apiFetch('/api/admin/logout',{method:'POST'});clearAuthToken('admin');location.href='/admin/login'});load();setInterval(load,5000);
</script></body></html>
