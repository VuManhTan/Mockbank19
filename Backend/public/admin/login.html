<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập quản trị — Mộc</title><link rel="stylesheet" href="/shop/style.css"><style>
.login-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px 18px}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e4e8e2;padding:35px}.login-card h1{font:600 32px var(--serif);margin:0 0 8px}.login-card p{font-size:11px;color:#808b82;line-height:1.7}.login-card label{display:block;font-size:10px;margin:14px 0 6px}.login-card input{width:100%;padding:13px;border:1px solid #dce3da;background:#fbfcfa}.login-card button{width:100%;margin-top:18px;padding:14px;background:#526d5a;color:white;border:0;font:600 11px var(--sans);cursor:pointer}.error{color:#a24e42!important;min-height:18px}.login-home{font-size:10px;color:#526d5a}
</style></head><body><header class="topbar"><a class="brand" href="/shop/"><span class="brand-mark">m</span><span>MỘC<span class="brand-dot">.</span></span></a><a class="login-home" href="/shop/">← Cửa hàng</a></header><main class="login-wrap"><section class="login-card"><p class="eyebrow">KHU VỰC QUẢN TRỊ</p><h1>Đăng nhập admin</h1><p>Đăng nhập bằng tài khoản quản trị được cấu hình trên máy chủ.</p><form id="login-form"><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">ĐĂNG NHẬP</button><p class="error" id="error" role="alert"></p></form></section></main><script src="/api-client.js?v=20261017-3"></script><script>
const form=document.querySelector('#login-form');const params=new URLSearchParams(location.search);function destination(){const value=params.get('return');return value==='/admin/products'?value:'/admin/orders'}form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const response=await apiFetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.message||'Đăng nhập thất bại');saveAuthToken('admin',data.token);location.href=destination()}catch(error){document.querySelector('#error').textContent=error.message;button.disabled=false}});
</script></body></html>
