<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mock Bank - Tài khoản</title>
  <link rel="stylesheet" href="/bank/style.css">
  <style>
    .dashboard{max-width:900px;margin:28px auto;padding:0 18px}.account{background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px}.header .bank-logo{text-align:left}.header button{width:auto;margin:0;padding:10px 14px}
    .account-info{color:#64748b}.balance{margin:20px 0;padding:22px;border-radius:15px;background:#eff6ff}.balance-row{display:flex;align-items:center;gap:12px}.balance strong{display:block;margin-top:7px;color:#1d4ed8;font-size:34px;letter-spacing:.03em}.icon-button{flex:0 0 42px;width:42px;height:42px;margin:5px 0 0;padding:9px;border:1px solid #bfdbfe;border-radius:10px;background:#fff;color:#1d4ed8;display:grid;place-items:center}.icon-button:hover{background:#dbeafe}.icon-button svg{width:22px;height:22px}.icon-button svg[hidden]{display:none!important}
    .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick-actions button{margin:0}
    .panel{margin-top:20px;padding:20px;border:1px solid #dbeafe;border-radius:14px;background:#fff}.panel h2{margin:0 0 14px;color:#1e3a8a;font-size:19px}#transferPanel[hidden],#historyPanel[hidden]{display:none}
    .form label{margin:12px 0 7px;font-size:14px}.form input{padding:12px;font-size:15px}.form button{margin-top:16px}
    .notice{min-height:20px;color:#1d4ed8;font-size:14px;line-height:1.5}.history{display:grid;gap:10px}.transaction{padding:14px;border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc;font-size:14px;line-height:1.55}
    .transaction-head{display:flex;justify-content:space-between;gap:12px}.amount{font-weight:700;white-space:nowrap}.amount.in{color:#15803d}.amount.out{color:#b91c1c}.transaction-detail{margin-top:7px;color:#334155}.transaction-meta{margin-top:8px;color:#64748b;font-size:12px}
    @media(max-width:600px){.account{padding:17px}.balance strong{font-size:28px}.quick-actions{grid-template-columns:1fr}.transaction-head{flex-direction:column;gap:2px}}
  </style>
</head>
<body>
  <main class="dashboard"><section class="account">
    <header class="header"><div><div class="bank-logo">MOCK BANK</div><p class="account-info" id="greeting">Đang tải tài khoản…</p></div><button id="logoutButton" type="button">ĐĂNG XUẤT</button></header>
    <p class="account-info">Số tài khoản: <b id="accountNumber">—</b></p>
    <section class="balance"><span>Số dư khả dụng</span><div class="balance-row"><strong id="balance">0 ₫</strong><button type="button" class="icon-button" id="toggleBalance" aria-label="Ẩn số dư" aria-pressed="false" title="Ẩn số dư"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"/></svg></button></div></section>
    <div class="quick-actions"><button type="button" onclick="location.href='/bank/scanner'">QUÉT QR</button><button type="button" id="showTransfer">CHUYỂN TIỀN</button><button type="button" id="historyToggle" aria-expanded="false">LỊCH SỬ GIAO DỊCH</button></div>
    <section class="panel" id="transferPanel" hidden><h2>Chuyển tiền</h2><form id="transferForm" class="form">
      <label for="recipientAccountNumber">Số tài khoản nhận</label><input id="recipientAccountNumber" name="recipientAccountNumber" inputmode="numeric" pattern="[0-9]{6,24}" minlength="6" maxlength="24" required>
      <label for="transferAmount">Số tiền (VND)</label><input id="transferAmount" name="amount" type="number" min="1" step="1" required>
      <label for="transferContent">Nội dung chuyển khoản</label><input id="transferContent" name="content" maxlength="200" placeholder="Ví dụ: Chuyển tiền">
      <button type="submit">XÁC NHẬN CHUYỂN TIỀN</button><p id="transferNotice" class="notice" role="status"></p>
    </form></section>
    <section class="panel" id="historyPanel" hidden><h2>Lịch sử giao dịch</h2><div id="history" class="history"><p>Nhấn nút lịch sử để tải giao dịch.</p></div></section>
  </section></main>
  <script src="/api-client.js?v=20261103-8"></script><script>
    const money=value=>`${Number(value).toLocaleString('vi-VN')} ₫`;
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let balanceVisible=true,currentBalance=0;
    function renderBalance(){document.querySelector('#balance').textContent=balanceVisible?money(currentBalance):'••••••';document.querySelector('#eyeIcon').hidden=!balanceVisible;document.querySelector('#eyeOffIcon').hidden=balanceVisible;const toggle=document.querySelector('#toggleBalance');toggle.setAttribute('aria-pressed',String(!balanceVisible));toggle.setAttribute('aria-label',balanceVisible?'Ẩn số dư':'Hiện số dư');toggle.title=balanceVisible?'Ẩn số dư':'Hiện số dư'}
    async function loadAccount(){const response=await apiFetch('/api/bank/account');if(!response.ok){location.href='/bank/login';return}const data=await response.json();document.querySelector('#greeting').textContent=`Xin chào ${data.account.name}`;document.querySelector('#accountNumber').textContent=data.account.accountNumber;currentBalance=Number(data.account.balance);renderBalance()}
    async function loadTransactions(){const host=document.querySelector('#history');try{const response=await apiFetch('/api/bank/transactions');if(!response.ok){if(response.status===401)location.href='/bank/login';throw Error('Không tải được lịch sử giao dịch.')}const data=await response.json();const list=data.transactions||[];if(!list.length){host.innerHTML='<p>Chưa có giao dịch.</p>';return}host.innerHTML=list.map(tx=>{const incoming=['TRANSFER_IN','ADMIN_CREDIT'].includes(tx.type)||(tx.orderId&&tx.status==='REFUNDED');const sign=incoming?'+':'−';const title=tx.type==='TRANSFER_IN'?'Tiền chuyển đến':tx.type==='TRANSFER_OUT'?'Chuyển tiền đi':tx.type==='ADMIN_CREDIT'?'Admin cộng số dư':tx.type==='ADMIN_DEBIT'?'Admin trừ số dư':tx.orderId?(tx.status==='REFUNDED'?'Hoàn tiền thanh toán':'Thanh toán đơn hàng'):'Giao dịch';const party=tx.counterpartyName?`${incoming?'Người gửi':'Người nhận'}: ${escapeHtml(tx.counterpartyName)} · ${escapeHtml(tx.counterpartyAccountNumber||'')}`:tx.sender?`Tài khoản gửi: ${escapeHtml(tx.sender)} · ${escapeHtml(tx.senderAccount||'')}`:'';const status=tx.status==='COMPLETED'?'Thành công':tx.status==='PENDING'?'Đang xử lý':tx.status==='REFUNDED'?'Đã hoàn tiền':escapeHtml(tx.status||'Không rõ');const id=tx.transferId||tx.transactionId||tx.orderId||'—';const balance=Number.isSafeInteger(Number(tx.balanceAfter))?`<div>Số dư sau giao dịch: <b>${money(tx.balanceAfter)}</b></div>`:'';return `<article class="transaction"><div class="transaction-head"><b>${title}</b><span class="amount ${incoming?'in':'out'}">${sign}${money(tx.amount)}</span></div><div class="transaction-detail">${party?`<div>${party}</div>`:''}<div>Nội dung: ${escapeHtml(tx.content||'—')}</div>${tx.orderId?`<div>Mã đơn hàng: ${escapeHtml(tx.orderId)}</div>`:''}${balance}</div><div class="transaction-meta">${new Date(tx.timestamp).toLocaleString('vi-VN')} · ${status} · Mã GD: ${escapeHtml(id)}</div></article>`}).join('')}catch(error){host.textContent=error.message}}
    document.querySelector('#transferForm').addEventListener('submit',async event=>{event.preventDefault();const notice=document.querySelector('#transferNotice'),form=event.currentTarget,button=form.querySelector('button[type="submit"]'),fields=Object.fromEntries(new FormData(form));fields.amount=Number(fields.amount);button.disabled=true;notice.textContent='Đang xử lý chuyển khoản…';try{const response=await apiFetch('/api/bank/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});const data=await response.json();if(!response.ok)throw Error(data.message||'Chuyển khoản thất bại.');notice.textContent=`Đã chuyển ${money(fields.amount)} đến ${data.recipient.name} (${data.recipient.accountNumber}). Mã GD: ${data.transferId}`;form.reset();await loadAccount();if(!document.querySelector('#historyPanel').hidden)await loadTransactions()}catch(error){notice.textContent=error.message}finally{button.disabled=false}});
    document.querySelector('#historyToggle').addEventListener('click',async event=>{const panel=document.querySelector('#historyPanel');panel.hidden=!panel.hidden;event.currentTarget.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)await loadTransactions()});
    document.querySelector('#showTransfer').addEventListener('click',()=>{const panel=document.querySelector('#transferPanel');panel.hidden=!panel.hidden;if(!panel.hidden)document.querySelector('#recipientAccountNumber').focus()});
    document.querySelector('#toggleBalance').addEventListener('click',()=>{balanceVisible=!balanceVisible;renderBalance()});
    document.querySelector('#logoutButton').addEventListener('click',async()=>{clearAuthToken('bank');await apiFetch('/api/bank/logout',{method:'POST'});location.href='/bank/login'});
    loadAccount();
  </script>
</body>
</html>
