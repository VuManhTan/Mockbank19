<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mock Bank - Tài khoản</title>
  <link rel="stylesheet" href="/bank/style.css">
  <style>
    .dashboard{max-width:900px;margin:28px auto;padding:0 18px}.account{background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px}.header .bank-logo{text-align:left}.header .icon-button{width:44px;height:44px;margin:0;padding:10px;flex:0 0 44px}
    .account-info{color:#64748b}.balance{margin:20px 0;padding:22px;border-radius:15px;background:#FFF7E3}.balance-row{display:flex;align-items:center;gap:12px}.balance strong{display:block;margin-top:7px;color:#1B397A;font-size:34px;letter-spacing:.03em}.icon-button{width:42px;height:42px;margin:5px 0 0;padding:9px;border:1px solid #F3D47A;border-radius:10px;background:#fff;color:#1B397A;display:grid;place-items:center}.icon-button:hover{background:#FFF0C2}.icon-button svg{width:22px;height:22px}.icon-button svg[hidden]{display:none!important}
    .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick-actions button{margin:0}
    .panel{margin-top:20px;padding:20px;border:1px solid #FFF0C2;border-radius:14px;background:#fff}.panel h2{margin:0 0 14px;color:#17336F;font-size:19px}#transferPanel[hidden],#historyPanel[hidden]{display:none}
    .form label{margin:12px 0 7px;font-size:14px}.form input,.form select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:15px}.form button{margin-top:16px}
    .notice{min-height:20px;color:#1B397A;font-size:14px;line-height:1.5}.history{display:grid;gap:10px}.transaction{padding:14px;border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc;font-size:14px;line-height:1.55}
    .transaction-head{display:flex;justify-content:space-between;gap:12px}.amount{font-weight:700;white-space:nowrap}.amount.in{color:#15803d}.amount.out{color:#b91c1c}.transaction-detail{margin-top:7px;color:#334155}.transaction-meta{margin-top:8px;color:#64748b;font-size:12px}
    .settings-dialog{width:min(540px,calc(100% - 28px));max-height:calc(100dvh - 32px);padding:0;border:0;border-radius:18px;box-shadow:0 22px 65px rgba(15,23,42,.35);overflow:auto}.settings-dialog::backdrop{background:rgba(15,23,42,.58)}.settings-content{padding:22px}.settings-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.settings-head h2{margin:0;color:#17336F}.settings-head .icon-button{margin:0}.settings-menu{display:grid;gap:10px;margin-top:20px}.settings-menu button,.settings-view button{margin:0}.settings-menu .logout-action{background:#dc2626}.settings-menu .logout-action:hover{background:#b91c1c}.settings-view{margin-top:18px}.settings-view[hidden],#settingsMenu[hidden]{display:none!important}.settings-view h3{margin:0 0 10px;color:#334155}.back-button{width:auto!important;margin:0 0 16px!important;padding:8px 0!important;background:transparent!important;color:#1B397A!important;text-align:left}.settings-dialog label{margin:12px 0 7px;font-size:14px}.settings-dialog input[readonly]{background:#f1f5f9;color:#64748b}.settings-dialog .form button{margin-top:14px}.settings-menu .language-button{display:flex;align-items:center;justify-content:space-between}.language-current{font-size:12px;opacity:.85}
    @media(max-width:600px){.account{padding:17px}.balance strong{font-size:28px}.quick-actions{grid-template-columns:1fr}.transaction-head{flex-direction:column;gap:2px}.settings-content{padding:17px}}
  </style>
</head>
<body>
  <main class="dashboard"><section class="account">
    <header class="header"><div><div class="iuh-brand"><img src="/bank/iuh-logo.png" alt="IUH - Industrial University of Ho Chi Minh City"></div><p class="account-info" id="greeting">Đang tải tài khoản…</p></div><button type="button" class="icon-button" id="settingsButton" aria-label="Cài đặt" title="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 13.4 4l2-.1 1-1.7 2.1 1.2-.4 2 1.4 1.4 2-.2.6 2.4-1.8 1-.2 2 1.5 1.4-1.3 2-1.9-.6-1.6 1.1-.1 2h-2.5l-.8-1.8-1.9-.5-1.6 1.2-1.8-1.7.9-1.8-.8-1.8-1.9-.6.2-2.5 2-.4.9-1.7-.8-1.8 2-1.5 1.6 1.2 1.9-.4z"/><circle cx="12" cy="11.5" r="3"/></svg></button></header>
    <p class="account-info"><span data-i18n="accountNumberLabel">Số tài khoản:</span> <b id="accountNumber">—</b></p>
    <section class="balance"><span data-i18n="availableBalance">Số dư khả dụng</span><div class="balance-row"><strong id="balance">0 ₫</strong><button type="button" class="icon-button" id="toggleBalance" aria-label="Ẩn số dư" aria-pressed="false" title="Ẩn số dư"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"/></svg></button></div></section>
    <div class="quick-actions"><button type="button" onclick="location.href='/bank/scanner'" data-i18n="scanQr">QUÉT QR</button><button type="button" id="showTransfer" data-i18n="transfer">CHUYỂN TIỀN</button><button type="button" id="historyToggle" aria-expanded="false" data-i18n="transactionHistory">LỊCH SỬ GIAO DỊCH</button></div>
    <section class="panel" id="transferPanel" hidden><h2 data-i18n="transfer">Chuyển tiền</h2><form id="transferForm" class="form">
      <label for="recipientAccountNumber" data-i18n="recipientAccount">Số tài khoản nhận</label><input id="recipientAccountNumber" name="recipientAccountNumber" inputmode="numeric" pattern="[0-9]{6,24}" minlength="6" maxlength="24" required>
      <label for="transferAmount" data-i18n="amountLabel">Số tiền (VND)</label><input id="transferAmount" name="amount" type="text" inputmode="numeric" data-thousands autocomplete="off" required>
      <label for="transferContent" data-i18n="transferMemo">Nội dung chuyển khoản</label><input id="transferContent" name="content" maxlength="200" placeholder="Ví dụ: Chuyển tiền" data-i18n-placeholder="memoPlaceholder">
      <button type="submit" data-i18n="confirmTransfer">XÁC NHẬN CHUYỂN TIỀN</button><p id="transferNotice" class="notice" role="status"></p>
    </form></section>
    <section class="panel" id="historyPanel" hidden><h2 data-i18n="transactionHistory">Lịch sử giao dịch</h2><div id="history" class="history"><p data-i18n="pressHistory">Nhấn nút lịch sử để tải giao dịch.</p></div></section>
  </section></main>
  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle"><div class="settings-content">
    <header class="settings-head"><h2 id="settingsTitle" data-i18n="settingsTitle">Cài đặt</h2><button type="button" class="icon-button" id="settingsClose" aria-label="Đóng" title="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <nav class="settings-menu" id="settingsMenu" aria-label="Cài đặt">
      <button type="button" data-settings-view="profileView" data-i18n="personalInfo">Thông tin cá nhân</button>
      <button type="button" data-settings-view="passwordView" data-i18n="changePassword">Đổi mật khẩu</button>
      <button type="button" class="language-button" data-settings-view="languageView"><span data-i18n="language">Ngôn ngữ</span><span class="language-current" id="languageCurrent">Tiếng Việt</span></button>
      <button type="button" class="logout-action" id="logoutButton" data-i18n="logout">Đăng xuất</button>
    </nav>
    <section class="settings-view" id="profileView" hidden><button type="button" class="back-button" data-back data-i18n="backToSettings">← Cài đặt</button><h3 data-i18n="personalInfo">Thông tin cá nhân</h3><form id="profileForm" class="form">
      <label for="profileName" data-i18n="fullName">Họ và tên</label><input id="profileName" name="name" minlength="2" maxlength="100" required>
      <label for="profileUsername" data-i18n="username">Tên đăng nhập</label><input id="profileUsername" name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required>
      <label for="profileAccountNumber" data-i18n="accountNumberLabel">Số tài khoản</label><input id="profileAccountNumber" readonly>
      <button type="submit" data-i18n="saveInfo">LƯU THÔNG TIN</button><p id="profileNotice" class="notice" role="status"></p>
    </form></section>
    <section class="settings-view" id="passwordView" hidden><button type="button" class="back-button" data-back data-i18n="backToSettings">← Cài đặt</button><h3 data-i18n="changePassword">Đổi mật khẩu</h3><form id="passwordForm" class="form">
      <label for="currentPassword" data-i18n="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
      <label for="newPassword" data-i18n="newPassword">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <label for="confirmNewPassword" data-i18n="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmNewPassword" name="confirmNewPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <button type="submit" data-i18n="changePassword">ĐỔI MẬT KHẨU</button><p id="passwordNotice" class="notice" role="status"></p>
    </form></section>
    <section class="settings-view" id="languageView" hidden><button type="button" class="back-button" data-back data-i18n="backToSettings">← Cài đặt</button><h3 data-i18n="language">Ngôn ngữ</h3><form id="languageForm" class="form">
      <label for="languageSelect" data-i18n="chooseLanguage">Chọn ngôn ngữ</label><select id="languageSelect"><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
      <button type="submit" data-i18n="applyLanguage">ÁP DỤNG</button><p id="languageNotice" class="notice" role="status"></p>
    </form></section>
  </div></dialog>
  <script src="/api-client.js?v=20261109-1"></script><script>
    const translations={
      vi:{greeting:'Xin chào {name}',accountNumberLabel:'Số tài khoản:',availableBalance:'Số dư khả dụng',hideBalance:'Ẩn số dư',showBalance:'Hiện số dư',scanQr:'QUÉT QR',transfer:'CHUYỂN TIỀN',transactionHistory:'LỊCH SỬ GIAO DỊCH',recipientAccount:'Số tài khoản nhận',amountLabel:'Số tiền (VND)',transferMemo:'Nội dung chuyển khoản',memoPlaceholder:'Ví dụ: Chuyển tiền',confirmTransfer:'XÁC NHẬN CHUYỂN TIỀN',pressHistory:'Nhấn nút lịch sử để tải giao dịch.',loadingHistory:'Đang tải lịch sử…',noTransactions:'Chưa có giao dịch.',historyUnavailable:'Không tải được lịch sử giao dịch.',transferProcessing:'Đang xử lý chuyển khoản…',transferSuccess:'Đã chuyển {amount} đến {name} ({account}). Mã GD: {id}',transactionIn:'Tiền chuyển đến',transactionOut:'Chuyển tiền đi',adminCredit:'Admin cộng số dư',adminDebit:'Admin trừ số dư',refund:'Hoàn tiền thanh toán',payment:'Thanh toán đơn hàng',transaction:'Giao dịch',sender:'Người gửi',recipient:'Người nhận',memo:'Nội dung',orderId:'Mã đơn hàng',balanceAfter:'Số dư sau giao dịch',completed:'Thành công',pending:'Đang xử lý',refunded:'Đã hoàn tiền',unknown:'Không rõ',transactionId:'Mã GD',settingsTitle:'Cài đặt',personalInfo:'Thông tin cá nhân',changePassword:'Đổi mật khẩu',language:'Ngôn ngữ',logout:'Đăng xuất',backToSettings:'← Cài đặt',fullName:'Họ và tên',username:'Tên đăng nhập',saveInfo:'LƯU THÔNG TIN',profileSaved:'Đã cập nhật thông tin tài khoản.',currentPassword:'Mật khẩu hiện tại',newPassword:'Mật khẩu mới (ít nhất 8 ký tự)',confirmPassword:'Nhập lại mật khẩu mới',passwordSaved:'Đã đổi mật khẩu.',passwordMismatch:'Mật khẩu mới nhập lại chưa khớp.',chooseLanguage:'Chọn ngôn ngữ',applyLanguage:'ÁP DỤNG',languageSaved:'Đã đổi ngôn ngữ.',close:'Đóng',errorBalance:'Số dư không đủ',errorRecipient:'Không tìm thấy tài khoản nhận',errorSelf:'Không thể chuyển tiền vào chính tài khoản này',errorRecipientInactive:'Tài khoản nhận không còn hoạt động',errorInvalidAmount:'Số tiền phải là số nguyên dương',errorAccountNumber:'Số tài khoản nhận không hợp lệ',errorPassword:'Mật khẩu hiện tại không đúng',errorDuplicateUsername:'Tên đăng nhập đã được sử dụng',genericError:'Yêu cầu không thành công.'},
      en:{greeting:'Hello, {name}',accountNumberLabel:'Account number:',availableBalance:'Available balance',hideBalance:'Hide balance',showBalance:'Show balance',scanQr:'SCAN QR',transfer:'TRANSFER',transactionHistory:'TRANSACTION HISTORY',recipientAccount:'Recipient account number',amountLabel:'Amount (VND)',transferMemo:'Transfer note',memoPlaceholder:'e.g. Transfer',confirmTransfer:'CONFIRM TRANSFER',pressHistory:'Select Transaction History to load transactions.',loadingHistory:'Loading transaction history…',noTransactions:'No transactions yet.',historyUnavailable:'Could not load transaction history.',transferProcessing:'Processing transfer…',transferSuccess:'Transferred {amount} to {name} ({account}). Ref: {id}',transactionIn:'Money received',transactionOut:'Money sent',adminCredit:'Admin balance credit',adminDebit:'Admin balance debit',refund:'Payment refund',payment:'Order payment',transaction:'Transaction',sender:'Sender',recipient:'Recipient',memo:'Note',orderId:'Order ID',balanceAfter:'Balance after transaction',completed:'Completed',pending:'Pending',refunded:'Refunded',unknown:'Unknown',transactionId:'Ref',settingsTitle:'Settings',personalInfo:'Personal information',changePassword:'Change password',language:'Language',logout:'Log out',backToSettings:'← Settings',fullName:'Full name',username:'Username',saveInfo:'SAVE INFORMATION',profileSaved:'Account information updated.',currentPassword:'Current password',newPassword:'New password (at least 8 characters)',confirmPassword:'Confirm new password',passwordSaved:'Password changed.',passwordMismatch:'The new passwords do not match.',chooseLanguage:'Choose language',applyLanguage:'APPLY',languageSaved:'Language updated.',close:'Close',errorBalance:'Insufficient balance',errorRecipient:'Recipient account not found',errorSelf:'You cannot transfer money to the same account',errorRecipientInactive:'Recipient account is inactive',errorInvalidAmount:'Amount must be a positive whole number',errorAccountNumber:'Recipient account number is invalid',errorPassword:'Current password is incorrect',errorDuplicateUsername:'Username is already in use',genericError:'The request failed.'}
    };
    let language=localStorage.getItem('mockbank-language')==='en'?'en':'vi',balanceVisible=true,currentBalance=0,currentName='';
    const t=(key,values={})=>Object.entries(values).reduce((text,[name,value])=>text.replaceAll(`{${name}}`,String(value)),translations[language][key]||key);
    const money=value=>`${Number(value).toLocaleString(language==='en'?'en-US':'vi-VN')} ₫`;
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function translatedError(message){const value=String(message||'');if(value.includes('Số dư không đủ'))return t('errorBalance');if(value.includes('Không tìm thấy tài khoản nhận'))return t('errorRecipient');if(value.includes('Không thể chuyển tiền vào chính tài khoản'))return t('errorSelf');if(value.includes('Tài khoản nhận không còn hoạt động'))return t('errorRecipientInactive');if(value.includes('Số tiền phải là'))return t('errorInvalidAmount');if(value.includes('Số tài khoản nhận không hợp lệ'))return t('errorAccountNumber');if(value.includes('Mật khẩu hiện tại không đúng'))return t('errorPassword');if(value.includes('Tên đăng nhập đã được sử dụng'))return t('errorDuplicateUsername');return value||t('genericError')}
    function applyLanguage(){document.documentElement.lang=language;document.title=language==='en'?'Mock Bank - Account':'Mock Bank - Tài khoản';document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=t(node.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(node=>{node.placeholder=t(node.dataset.i18nPlaceholder)});document.querySelector('#languageSelect').value=language;document.querySelector('#languageCurrent').textContent=language==='en'?'English':'Tiếng Việt';document.querySelector('#settingsMenu').setAttribute('aria-label',t('settingsTitle'));document.querySelector('#settingsButton').title=t('settingsTitle');document.querySelector('#settingsButton').setAttribute('aria-label',t('settingsTitle'));document.querySelector('#settingsClose').title=t('close');document.querySelector('#settingsClose').setAttribute('aria-label',t('close'));document.querySelector('#greeting').textContent=currentName?t('greeting',{name:currentName}):'…';renderBalance()}
    function setLanguage(value){language=value==='en'?'en':'vi';localStorage.setItem('mockbank-language',language);applyLanguage()}
    function renderBalance(){document.querySelector('#balance').textContent=balanceVisible?money(currentBalance):'••••••';document.querySelector('#eyeIcon').hidden=!balanceVisible;document.querySelector('#eyeOffIcon').hidden=balanceVisible;const toggle=document.querySelector('#toggleBalance');toggle.setAttribute('aria-pressed',String(!balanceVisible));toggle.setAttribute('aria-label',balanceVisible?t('hideBalance'):t('showBalance'));toggle.title=balanceVisible?t('hideBalance'):t('showBalance')}
    async function loadAccount(){const response=await apiFetch('/api/bank/account');if(!response.ok){location.href='/bank/login';return}const data=await response.json();currentName=data.account.name;document.querySelector('#greeting').textContent=t('greeting',{name:currentName});document.querySelector('#accountNumber').textContent=data.account.accountNumber;document.querySelector('#profileName').value=data.account.name;document.querySelector('#profileUsername').value=data.account.username;document.querySelector('#profileAccountNumber').value=data.account.accountNumber;currentBalance=Number(data.account.balance);renderBalance()}
    async function loadTransactions(){const host=document.querySelector('#history');host.innerHTML=`<p>${t('loadingHistory')}</p>`;try{const response=await apiFetch('/api/bank/transactions');if(!response.ok){if(response.status===401)location.href='/bank/login';throw Error(t('historyUnavailable'))}const data=await response.json();const list=data.transactions||[];if(!list.length){host.innerHTML=`<p>${t('noTransactions')}</p>`;return}host.innerHTML=list.map(tx=>{const incoming=(['TRANSFER_IN','ORDER_PAYMENT_IN','ADMIN_CREDIT'].includes(tx.type)&&tx.status!=='REFUNDED')||(tx.orderId&&tx.status==='REFUNDED'&&(tx.direction==='OUT'||!tx.direction));const sign=incoming?'+':'−';const title=tx.type==='TRANSFER_IN'?t('transactionIn'):tx.type==='TRANSFER_OUT'?t('transactionOut'):tx.type==='ADMIN_CREDIT'?t('adminCredit'):tx.type==='ADMIN_DEBIT'?t('adminDebit'):tx.orderId?(tx.status==='REFUNDED'?t('refund'):t('payment')):t('transaction');const otherIsSender=(tx.direction==='IN'&&tx.status!=='REFUNDED')||(tx.direction==='OUT'&&tx.status==='REFUNDED');const otherName=tx.counterpartyName||(otherIsSender?tx.senderName:tx.recipientName)||tx.sender;const otherNumber=tx.counterpartyAccountNumber||(otherIsSender?tx.senderAccountNumber:tx.recipientAccountNumber)||tx.senderAccount;const party=otherName?`${otherIsSender?t('sender'):t('recipient')}: ${escapeHtml(otherName)} · ${escapeHtml(otherNumber||'')}`:'';const status=tx.status==='COMPLETED'?t('completed'):tx.status==='PENDING'?t('pending'):tx.status==='REFUNDED'?t('refunded'):escapeHtml(tx.status||t('unknown'));const id=tx.transferId||tx.transactionId||tx.orderId||'—';const balance=Number.isSafeInteger(Number(tx.balanceAfter))?`<div>${t('balanceAfter')}: <b>${money(tx.balanceAfter)}</b></div>`:'';return `<article class="transaction"><div class="transaction-head"><b>${title}</b><span class="amount ${incoming?'in':'out'}">${sign}${money(tx.amount)}</span></div><div class="transaction-detail">${party?`<div>${party}</div>`:''}<div>${t('memo')}: ${escapeHtml(tx.content||'—')}</div>${tx.orderId?`<div>${t('orderId')}: ${escapeHtml(tx.orderId)}</div>`:''}${balance}</div><div class="transaction-meta">${new Date(tx.timestamp).toLocaleString(language==='en'?'en-US':'vi-VN')} · ${status} · ${t('transactionId')}: ${escapeHtml(id)}</div></article>`}).join('')}catch(error){host.textContent=translatedError(error.message)}}
    document.querySelector('#transferForm').addEventListener('submit',async event=>{event.preventDefault();const notice=document.querySelector('#transferNotice'),form=event.currentTarget,button=form.querySelector('button[type="submit"]'),fields=Object.fromEntries(new FormData(form));fields.amount=window.parseThousandsInput(fields.amount);button.disabled=true;notice.textContent=t('transferProcessing');try{const response=await apiFetch('/api/bank/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});const data=await response.json();if(!response.ok)throw Error(data.message||t('genericError'));notice.textContent=t('transferSuccess',{amount:money(fields.amount),name:data.recipient.name,account:data.recipient.accountNumber,id:data.transferId});form.reset();await loadAccount();if(!document.querySelector('#historyPanel').hidden)await loadTransactions()}catch(error){notice.textContent=translatedError(error.message)}finally{button.disabled=false}});
    document.querySelector('#historyToggle').addEventListener('click',async event=>{const panel=document.querySelector('#historyPanel');panel.hidden=!panel.hidden;event.currentTarget.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)await loadTransactions()});
    document.querySelector('#showTransfer').addEventListener('click',()=>{const panel=document.querySelector('#transferPanel');panel.hidden=!panel.hidden;if(!panel.hidden)document.querySelector('#recipientAccountNumber').focus()});
    document.querySelector('#toggleBalance').addEventListener('click',()=>{balanceVisible=!balanceVisible;renderBalance()});
    const settingsDialog=document.querySelector('#settingsDialog'),settingsMenu=document.querySelector('#settingsMenu');
    function showSettingsView(id){settingsMenu.hidden=id!=='settingsMenu';document.querySelectorAll('.settings-view').forEach(view=>view.hidden=view.id!==id)}
    document.querySelector('#settingsButton').addEventListener('click',()=>{showSettingsView('settingsMenu');settingsDialog.showModal()});
    document.querySelector('#settingsClose').addEventListener('click',()=>settingsDialog.close());
    settingsDialog.addEventListener('click',event=>{if(event.target===settingsDialog)settingsDialog.close()});
    document.querySelectorAll('[data-settings-view]').forEach(button=>button.addEventListener('click',()=>showSettingsView(button.dataset.settingsView)));
    document.querySelectorAll('[data-back]').forEach(button=>button.addEventListener('click',()=>showSettingsView('settingsMenu')));
    document.querySelector('#profileForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),notice=document.querySelector('#profileNotice');button.disabled=true;notice.textContent='';try{const response=await apiFetch('/api/bank/account/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.message||t('genericError'));saveAuthToken('bank',data.token);currentName=data.account.name;document.querySelector('#greeting').textContent=t('greeting',{name:currentName});notice.textContent=t('profileSaved')}catch(error){notice.textContent=translatedError(error.message)}finally{button.disabled=false}});
    document.querySelector('#passwordForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),notice=document.querySelector('#passwordNotice'),fields=Object.fromEntries(new FormData(form));notice.textContent='';if(fields.newPassword!==fields.confirmNewPassword){notice.textContent=t('passwordMismatch');return}delete fields.confirmNewPassword;button.disabled=true;try{const response=await apiFetch('/api/bank/account/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});const data=await response.json();if(!response.ok)throw Error(data.message||t('genericError'));saveAuthToken('bank',data.token);form.reset();notice.textContent=t('passwordSaved')}catch(error){notice.textContent=translatedError(error.message)}finally{button.disabled=false}});
    document.querySelector('#languageForm').addEventListener('submit',event=>{event.preventDefault();setLanguage(document.querySelector('#languageSelect').value);document.querySelector('#languageNotice').textContent=t('languageSaved')});
    document.querySelector('#logoutButton').addEventListener('click',async()=>{clearAuthToken('bank');await apiFetch('/api/bank/logout',{method:'POST'});location.href='/bank/login'});
    applyLanguage();loadAccount();
  </script>
</body>
</html>
